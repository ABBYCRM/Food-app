kind = "web"
previewPath = "/"
title = "Mestizo Umami"
version = "0.1.0"
id = "artifacts/mestizo-umami"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22049

[services.development]
run = "npm run dev"

[services.production]
build = [ "npm", "run", "build" ]
publicDir = "dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22049"
BASE_PATH = "/"
