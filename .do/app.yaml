name: mestizo-umami
region: nyc
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: web
    environment_slug: node-js
    github:
      repo: ABBYCRM/Food-app
      branch: main
      deploy_on_push: false
    source_dir: /
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
        type: GENERAL
      - key: PUBLIC_BASE_URL
        value: ${APP_URL}
        scope: RUN_TIME
        type: GENERAL
      - key: DATABASE_URL
        value: ${postgres-db.DATABASE_URL}
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_MAX_CONNECTIONS
        value: "10"
        scope: RUN_TIME
        type: GENERAL
      - key: COOKIE_SECURE
        value: "true"
        scope: RUN_TIME
        type: GENERAL
      - key: COOKIE_SAME_SITE
        value: Lax
        scope: RUN_TIME
        type: GENERAL
      - key: SESSION_TTL_SECONDS
        value: "2592000"
        scope: RUN_TIME
        type: GENERAL
      - key: OIDC_ATTEMPT_TTL_SECONDS
        value: "600"
        scope: RUN_TIME
        type: GENERAL
      - key: TRIAL_DAYS
        value: "7"
        scope: RUN_TIME
        type: GENERAL
      - key: INSTACART_API_BASE_URL
        value: https://connect.instacart.com
        scope: RUN_TIME
        type: GENERAL
      - key: TRUST_PROXY
        value: "true"
        scope: RUN_TIME
        type: GENERAL
    health_check:
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
      http_path: /readyz
    liveness_health_check:
      initial_delay_seconds: 30
      period_seconds: 20
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
      http_path: /healthz
    termination:
      grace_period_seconds: 30
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    environment_slug: node-js
    github:
      repo: ABBYCRM/Food-app
      branch: main
      deploy_on_push: false
    source_dir: /
    build_command: npm run build
    run_command: npm run migrate
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: DATABASE_URL
        value: ${postgres-db.DATABASE_URL}
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_MAX_CONNECTIONS
        value: "2"
        scope: RUN_TIME
        type: GENERAL
databases:
  - name: postgres-db
    engine: PG
    version: "18"
    production: false
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web
disable_edge_cache: true
enhanced_threat_control_enabled: true

