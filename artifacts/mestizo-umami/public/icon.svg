<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark rounded square -->
  <rect width="512" height="512" rx="96" fill="#0e0c09"/>

  <!-- Subtle glow behind bowl -->
  <ellipse cx="256" cy="295" rx="130" ry="30" fill="#b45309" opacity="0.12"/>

  <!-- Bowl body -->
  <path d="M136 248 Q136 360 256 360 Q376 360 376 248 Z" fill="#b45309"/>

  <!-- Bowl rim ellipse (top opening) -->
  <ellipse cx="256" cy="248" rx="120" ry="22" fill="#c96a0e"/>

  <!-- Inner bowl highlight (rim inner lip) -->
  <ellipse cx="256" cy="248" rx="100" ry="15" fill="#0e0c09" opacity="0.45"/>

  <!-- Bowl base / foot -->
  <ellipse cx="256" cy="358" rx="52" ry="10" fill="#8a3a04"/>

  <!-- Chopstick 1 (left, angled /) -->
  <rect x="183" y="148" width="10" height="130" rx="5"
        fill="#d97706"
        transform="rotate(-18 188 213)"/>
  <!-- Chopstick tip dot -->
  <circle cx="168" cy="154" r="5" fill="#fbbf24"/>

  <!-- Chopstick 2 (right, angled \) -->
  <rect x="319" y="148" width="10" height="130" rx="5"
        fill="#d97706"
        transform="rotate(18 324 213)"/>
  <circle cx="340" cy="154" r="5" fill="#fbbf24"/>

  <!-- Steam wisps (three curving lines) -->
  <!-- Left waft -->
  <path d="M214 220 Q204 195 214 172 Q224 149 214 126"
        stroke="#fbbf24" stroke-width="7" stroke-linecap="round"
        fill="none" opacity="0.7"/>
  <!-- Center waft -->
  <path d="M256 215 Q244 188 256 163 Q268 138 256 113"
        stroke="#fbbf24" stroke-width="8" stroke-linecap="round"
        fill="none" opacity="0.85"/>
  <!-- Right waft -->
  <path d="M298 220 Q310 195 298 172 Q286 149 298 126"
        stroke="#fbbf24" stroke-width="7" stroke-linecap="round"
        fill="none" opacity="0.7"/>

  <!-- "MU" wordmark at bottom -->
  <text x="256" y="425"
        font-family="Georgia, serif"
        font-size="46"
        font-weight="bold"
        letter-spacing="10"
        text-anchor="middle"
        fill="#b45309"
        opacity="0.85">MU</text>
</svg>
